services:
  - type: web
    name: parallel-scheduling-lab
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    disk:
      name: lab-records
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PATH
        value: /var/data/records.jsonl
